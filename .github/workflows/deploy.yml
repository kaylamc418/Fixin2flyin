name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fixin2flyin-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEPLOY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  deploy:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: Deploy and verify
    steps:
      - name: Checkout approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Add deployment marker
        run: printf '%s' "$DEPLOY_SHA" > deploy-marker.txt

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify deployed commit
        shell: bash
        run: |
          set -euo pipefail
          marker_url="https://fixin2flyin.kayamc418.workers.dev/deploy-marker.txt?sha=${DEPLOY_SHA}"

          for attempt in {1..12}; do
            deployed_sha="$(curl -fsSL --max-time 15 "$marker_url" || true)"
            if [[ "$deployed_sha" == "$DEPLOY_SHA" ]]; then
              echo "Verified deployment of $DEPLOY_SHA"
              exit 0
            fi

            echo "Waiting for Cloudflare deployment (${attempt}/12)..."
            sleep 10
          done

          echo "Deployment marker did not match $DEPLOY_SHA"
          exit 1

  visual-test:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: Responsive homepage audit
    needs: deploy
    steps:
      - name: Checkout approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Run responsive homepage audit
        env:
          BASE_URL: https://fixin2flyin.kayamc418.workers.dev
        run: npm run test:visual
