name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fixin2flyin-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy and verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Add deployment marker
        run: printf '%s' "$GITHUB_SHA" > deploy-marker.txt

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify deployed commit
        shell: bash
        run: |
          set -euo pipefail
          marker_url="https://fixin2flyin.kayamc418.workers.dev/deploy-marker.txt?sha=${GITHUB_SHA}"

          for attempt in {1..12}; do
            deployed_sha="$(curl -fsSL --max-time 15 "$marker_url" || true)"
            if [[ "$deployed_sha" == "$GITHUB_SHA" ]]; then
              echo "Verified deployment of $GITHUB_SHA"
              exit 0
            fi

            echo "Waiting for Cloudflare deployment (${attempt}/12)..."
            sleep 10
          done

          echo "Deployment marker did not match $GITHUB_SHA"
          exit 1

  visual-test:
    runs-on: ubuntu-latest
    name: Visual Overlap Audit
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Run visual overlap audit
        env:
          BASE_URL: https://fixin2flyin.kayamc418.workers.dev
        run: npm run test:visual
