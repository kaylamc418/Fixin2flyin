name: Deploy approved homepage after audit

on:
  workflow_run:
    workflows: ["Visual Overlap Audit"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: fixin2flyin-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'production-deploy-v2'
    runs-on: ubuntu-latest
    name: Deploy audited homepage
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout audited source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Add deployment marker
        run: printf '%s' "$DEPLOY_SHA" > deploy-marker.txt

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify deployed commit
        shell: bash
        run: |
          set -euo pipefail
          marker_url="https://fixin2flyin.kayamc418.workers.dev/deploy-marker.txt?sha=${DEPLOY_SHA}"

          for attempt in {1..12}; do
            deployed_sha="$(curl -fsSL --max-time 15 "$marker_url" || true)"
            if [[ "$deployed_sha" == "$DEPLOY_SHA" ]]; then
              echo "Verified deployment of $DEPLOY_SHA"
              exit 0
            fi

            echo "Waiting for Cloudflare deployment (${attempt}/12)..."
            sleep 10
          done

          echo "Deployment marker did not match $DEPLOY_SHA"
          exit 1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production homepage
        env:
          BASE_URL: https://fixin2flyin.kayamc418.workers.dev
        run: npm run test:visual
